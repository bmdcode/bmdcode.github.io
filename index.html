<style>
/* Application téléphone : barre d'onglets fixe en bas, une colonne, feuilles de saisie qui montent du bas */
:root{
  --fond:#f3f5f2; --surface:#ffffff; --encre:#1b2632; --doux:#5a6672; --trait:#d8ddd5;
  --accent:#1f4979; --accent-doux:#e2e9f3; --present:#2f6b45; --present-doux:#e1efe5;
  --absent:#b23a2b; --absent-doux:#f8e3df; --alerte:#8a4b08; --alerte-doux:#f8ecd9;
  --doc-fond:#ffffff; --doc-encre:#111111; --doc-trait:#333333; --doc-gris:#dde3ea;
  --f-titre:"Bitter",Georgia,serif; --f-texte:"Noto Sans",system-ui,sans-serif; --f-ar:"Noto Naskh Arabic","Traditional Arabic",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --fond:#141a20; --surface:#1d252d; --encre:#e7ebee; --doux:#a2acb5; --trait:#334049;
  --accent:#8fb4e3; --accent-doux:#22324a; --present:#8cc7a0; --present-doux:#1f3528;
  --absent:#f0998b; --absent-doux:#43231f; --alerte:#e9b46a; --alerte-doux:#3a2c18; color-scheme:dark}}
:root[data-theme="dark"]{
  --fond:#141a20; --surface:#1d252d; --encre:#e7ebee; --doux:#a2acb5; --trait:#334049;
  --accent:#8fb4e3; --accent-doux:#22324a; --present:#8cc7a0; --present-doux:#1f3528;
  --absent:#f0998b; --absent-doux:#43231f; --alerte:#e9b46a; --alerte-doux:#3a2c18; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--fond);color:var(--encre);font:15px/1.5 var(--f-texte)}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate}
h1,h2,h3{font-family:var(--f-titre);margin:0;line-height:1.2;text-wrap:balance}
main{max-width:760px;margin:0 auto;padding-block:12px 110px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.bandeau{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bandeau h1{font-size:1.35rem;color:var(--accent)}
.bandeau .ar{color:var(--doux);font-size:1rem}
.mode{font-size:.75rem;padding:2px 10px;border-radius:999px;background:var(--present-doux);color:var(--present)}
.mode.local{background:var(--alerte-doux);color:var(--alerte)}
.carte{background:var(--surface);border:1px solid var(--trait);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.carte h2{font-size:1.05rem}
.sous{color:var(--doux);font-size:.85rem}
.tuiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tuile{background:var(--surface);border:1px solid var(--trait);border-radius:10px;padding:12px}
.tuile b{display:block;font-family:var(--f-titre);font-size:1.6rem;font-variant-numeric:tabular-nums}
.tuile span{font-size:.8rem;color:var(--doux)}
.ligne{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--trait)}
.ligne:last-child{border-bottom:0}
.ligne .g{min-width:0;flex:1}
.ligne .t{font-weight:600;overflow-wrap:anywhere}
.ligne .s{font-size:.8rem;color:var(--doux)}
.badge{font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--accent-doux);color:var(--accent);white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid var(--trait);background:var(--surface);color:var(--encre);border-radius:999px;padding:6px 14px;font:600 .85rem var(--f-texte);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
label.champ{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--doux);font-weight:600}
input,select,textarea{font:16px var(--f-texte);color:var(--encre);background:var(--surface);border:1px solid var(--trait);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.grille2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:420px){.grille2{grid-template-columns:1fr}}
button{font:600 .92rem var(--f-texte);border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--surface);padding:11px 16px;cursor:pointer}
button.second{background:var(--surface);color:var(--accent)}
button.danger{background:var(--absent);border-color:var(--absent);color:var(--surface)}
button:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{flex:1 1 140px}
.erreur{color:var(--absent);font-size:.85rem}
.info{background:var(--alerte-doux);color:var(--encre);border-radius:8px;padding:10px 12px;font-size:.88rem}
.vide{color:var(--doux);text-align:center;padding:18px 8px}
/* appel */
.appel{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--trait);flex-wrap:wrap}
.appel .g{flex:1;min-width:0}
.bascule{min-width:96px;border-radius:999px;padding:9px 12px}
.bascule.p{background:var(--present-doux);border-color:var(--present);color:var(--present)}
.bascule.a{background:var(--absent);border-color:var(--absent);color:var(--surface)}
.motif{flex-basis:100%}
.compteur{font-variant-numeric:tabular-nums;font-weight:600}
/* tableaux internes */
.defile{overflow-x:auto;border:1px solid var(--trait);border-radius:8px}
table.mois{border-collapse:collapse;font-size:.75rem;font-variant-numeric:tabular-nums}
table.mois th,table.mois td{border:1px solid var(--trait);padding:4px 5px;text-align:center;white-space:nowrap}
table.mois td.n{text-align:left;position:sticky;left:0;background:var(--surface);max-width:140px;overflow:hidden;text-overflow:ellipsis}
table.mois td.A{background:var(--absent-doux);color:var(--absent);font-weight:600}
/* aperçu document : une feuille blanche, comme le papier */
.apercu{overflow-x:auto;border:1px solid var(--trait);border-radius:8px;background:var(--doc-gris);padding:10px}
.feuille{background:var(--doc-fond);color:var(--doc-encre);width:760px;padding:24px;margin:0 auto;box-shadow:0 1px 4px rgba(0,0,0,.18)}
/* barre d'onglets */
nav.onglets{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--trait);
  display:grid;grid-template-columns:repeat(6,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
nav.onglets button{background:none;border:0;color:var(--doux);border-radius:0;padding:8px 2px 10px;font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.onglets button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.onglets button[aria-current="page"]{color:var(--accent)}
/* feuille de saisie */
.voile{position:fixed;inset:0;z-index:30;background:rgba(10,15,20,.45);display:flex;align-items:flex-end;justify-content:center}
.panneau{background:var(--fond);width:100%;max-width:760px;max-height:92%;overflow-y:auto;border-radius:14px 14px 0 0;
  padding-block:16px calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.panneau h2{font-size:1.15rem}
.fab{position:fixed;z-index:21;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));border-radius:999px;padding:13px 18px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.toast{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--encre);color:var(--fond);padding:10px 16px;border-radius:8px;font-size:.9rem;max-width:90%}
.seg{display:flex;border:1px solid var(--accent);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;background:var(--surface);color:var(--accent);padding:9px 6px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.photoZone{display:flex;gap:12px;align-items:flex-start}
.photoCadre{width:96px;height:120px;flex:0 0 auto;border:1px dashed var(--trait);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--doux);font-size:.8rem;background:var(--fond)}
.photoCadre img{width:100%;height:100%;object-fit:cover}
.imgReg{max-height:90px;max-width:160px;background:repeating-conic-gradient(var(--trait) 0 25%,transparent 0 50%) 0 0/12px 12px;border-radius:6px}
.panneau>*{flex-shrink:0}
.pagesL .vig img{height:170px}
.vignettes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:6px 0}.vig{display:flex;flex-direction:column;gap:2px;padding:3px;border:2px solid var(--trait);border-radius:10px;background:#fff;color:#333;font-size:.72rem;min-height:0;text-align:center}.vig img{width:100%;height:90px;object-fit:contain;display:block}.vig[aria-pressed="true"]{border-color:var(--accent,#1f4e79);box-shadow:0 0 0 2px var(--accent,#1f4e79)}
.fichierBtn{position:relative;overflow:hidden;display:block;text-align:center}
.fichierBtn input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:60px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
